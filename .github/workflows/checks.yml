name: Checks

on:
  pull_request:
  push:
    branches: [main, stable]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y shellcheck python3-yaml
      - name: Run checks
        run: bash tests/lint.sh
