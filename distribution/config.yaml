# Council defaults. Applied when the profile is installed; preserved on
# `hermes profile update` unless --force-config is passed.
# The model is NOT set here: install.sh copies yours from the existing
# Hermes setup or asks with `hermes model`.

agent:
  reasoning_effort: low   # quick chat replies; "convene the council" for the hard ones
  # The council needs: clarify (buttons), cronjob (brief and recaps), memory,
  # delegation (full council), browser and web (errands), tts/stt (voices).
  disabled_toolsets: []

approvals:
  mode: manual            # ask before every risky command
  cron_mode: deny         # scheduled jobs can never run risky commands
  unattended_mode: deny

skills:
  write_approval: true    # show any new or changed skill before saving it

# Discord (the recommended way in): answer in public channels without an
# @mention, and keep each person's session separate in shared channels.
# Each person's DM stays private (plugins/council-privacy).
discord:
  require_mention: false
group_sessions_per_user: true

platforms:
  telegram:
    extra:
      drop_pending_on_cold_boot: false   # don't lose texts sent during a reboot
